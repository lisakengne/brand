name: production-ci

on:
  push:
    branches:
      - "main"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v3


      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          version: "lab:latest"
          driver: cloud
          endpoint: "nexah/nnj"
          install: true

      - name: Determine next version
        id: get_version
        run: |
          # Run the script to get the next version
          chmod +x ./increment_version.sh
          next_version=$(./increment_version.sh | awk -F= '{print $2}')
          echo "next_version=$next_version" >> $GITHUB_ENV

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64/v8
          tags: |
            nexah/brand:${{ env.next_version }}
            nexah/brand:latest
          push: true

      - name: Create Git Tag
        if: github.ref == 'refs/heads/main'
        run: |
          git tag ${{ env.next_version }}
          git push origin ${{ env.next_version }}

      - name: Push new branch for release
        if: github.ref == 'refs/heads/main'
        run: |
          branch_name="release/${{ env.next_version }}"
          git checkout -b $branch_name
          git push origin $branch_name
